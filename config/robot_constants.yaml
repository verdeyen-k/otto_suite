# Physical constants and runtime-tunable limits for this chassis.
# Loaded at runtime by src/robot/robot_config.cpp -- flat "key: value"
# pairs only, no nested structure. Edit this file; no rebuild needed.
#
# Chassis geometry and drivetrain facts are per-robot facts confirmed
# directly (not derived from a manual): 475mm track width, 625mm
# wheelbase, 170mm wheel diameter, 524288 counts/rev, 1:1 direct drive.
#
# drive_encoder_counts_per_rev was briefly "corrected" to 4096 (the
# ZLTech motor's own spec) on 2026-09-08, on the theory that 524288 --
# matching the ZeroErr steering encoder's unrelated resolution -- was
# copy-paste-wrong here. Reverted 2026-09-09: real-hardware driving
# after that change was ~128-140x slower than before, i.e. very much
# NOT "correct" in practice. drive_encoder_counts_per_rev must match
# what the Copley drive itself is actually configured to (object
# 0x2383 sub-index 23, see tools/copley_encoder_check.cpp) for velocity
# commands to convert correctly -- and the drive's own configured value
# was never actually changed to 4096 to match the motor spec, so the
# host and drive now agree again at 524288, whatever the motor
# datasheet says. If the drive is ever deliberately reconfigured to
# 4096 (and that reconfiguration verified with copley_encoder_check
# against sudo access, not assumed), update this to match then --
# not before.

##### Robot Constants #####
wheelbase_width_m: 0.475
wheelbase_length_m: 0.625
wheel_diameter_m: 0.172

##### Robot performance constraints #####
# Defaults for teleop's --max-speed-mps/--max-omega-deg-s/etc. -- pass the
# matching CLI flag on a given run to override without editing this file.
# Briefly raised to 1.3/150 on 2026-09-09 to compensate for the
# drive_encoder_counts_per_rev change above; reverted to these original
# values (confirmed appropriate/controllable at max stick) along with it.
max_speed_mps: 0.5
max_omega_deg_s: 60
max_accel_mps2: 1

###### Steering Actuators #####
# eRob manual Table 12-1: "Recommended Acc./Dec. Time >= 0.3s" to reach max
# rate over that same 0.3s, rather than a velocity step.
max_steer_accel_deg_s2: 600.0
# angular velocity -- 600 deg/s^2 matches reaching the default 180 deg/s
max_steer_rate_deg_s: 180.0
steer_angle_offset_deg_fl: 539.47
steer_angle_offset_deg_fr: 356.86
steer_angle_offset_deg_rl: -240.73
steer_angle_offset_deg_rr: 11.02

# Whether each module's steer actuator's positive raw-degree direction is
# physically reversed relative to the wheel-frame convention (CCW
# positive) -- a mounting fact, not a calibration number. Translation
# commands (all modules at the same angle) can look correct even with
# this wrong; rotate-in-place is what exposes it, since it needs each
# module at a different, correctly-signed angle -- confirmed here: all 4
# modules needed inverting after rotate-in-place formed an "X" instead of
# a tangential pinwheel. If this ever needs re-deriving (new hardware, a
# module swapped): compare each wheel's ACTUAL physical direction against
# the expected tangent angle for a small +omega command at the current
# wheelbase_width_m/wheelbase_length_m above (CCW, degrees from forward):
# FL~127, FR~53, RL~-127, RR~-53. No need to recalibrate
# steer_angle_offset_deg above when you flip invert -- it was read with
# the wheel at 0, where invert is a no-op.
steer_invert_fl: 1
steer_invert_fr: 1
steer_invert_rl: 1
steer_invert_rr: 1


##### Drive Wheels #####
# 524288 -- see the header comment at the top of this file for the
# 2026-09-08/09 back-and-forth on this value. Must match whatever the
# Copley drive itself is actually configured to for Motor Encoder
# Counts/Rev (object 0x2383 sub-index 23, tools/copley_encoder_check.cpp
# reads it live), regardless of what the ZLTech motor's own datasheet
# says that number "should" be -- the two disagreeing is what matters
# for whether a commanded m/s converts to the right raw velocity.
drive_encoder_counts_per_rev: 524288
drive_gear_ratio: 1.0

# Whether each module's drive actuator's positive raw-velocity direction is
# physically reversed relative to the wheel-frame convention (positive =
# forward) -- a mounting fact, not a calibration number, same reasoning as
# steer_invert above. Drive a module forward at low speed and compare
# against the commanded sign; flip here (not drive_gear_ratio or wiring)
# if a module runs backward relative to what was commanded.
drive_invert_fl: 0
drive_invert_fr: 0
drive_invert_rl: 0
drive_invert_rr: 0

# Hard ceiling on any single drive wheel's own rotational speed from datasheet.
# Robot speeds are derated to keep the robot below this
max_wheel_speed_rpm: 160

##### Bus Locations #####
# Which EtherCAT slave (and Copley axis A/B) plays each module's
# steer/drive role -- from prior full_shake runs, NOT independently
# verified against docs/ecatbustopo.md's physical layout notes (those two
# have disagreed before: topology doc said slave 6, live testing showed
# slave 7). If slave numbers ever seem off, re-scan (slaveinfo or any
# tool's own scan output) rather than trusting either document blindly.
# teleop/swerve_kinematics_test's --fl/--fr/--rl/--rr flags override these
# per-run without editing this file.
module_steer_slave_fl: 8
module_drive_slave_fl: 2
module_drive_axis_fl: b
# Live-tested 2026-09-09 with the z-stage temporarily wired in-line on the
# bus ahead of FR (shifting everything downstream of it by +3 slave
# indices) -- FR's steer axis showed up as slave 12, not 9, while the
# z-stage was connected. If the z-stage comes back off and FR stops
# responding at 12, re-verify with slaveinfo/zeroerr_state before assuming
# this is still right.
module_steer_slave_fr: 12
module_drive_slave_fr: 3
module_drive_axis_fr: b
module_steer_slave_rl: 6
module_drive_slave_rl: 2
module_drive_axis_rl: a
module_steer_slave_rr: 5
module_drive_slave_rr: 3
module_drive_axis_rr: a
